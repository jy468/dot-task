:root{
  --bg:#EEF1F3; --surface:#FFFFFF; --ink:#1A2026; --muted:#5B6670; --line:#D5DBE0;
  --accent:#2E5E8C; --accent-ink:#FFFFFF; --warn:#9A5600; --warn-bg:#FBF0E1; --ok:#2F7A55; --ok-bg:#E5F3EB;
  --font:"Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121518; --surface:#1A1F24; --ink:#E4E8EC; --muted:#98A3AD; --line:#2C343B;
    --accent:#7FA8D6; --accent-ink:#0E1620; --warn:#E0A458; --warn-bg:#2B2217; --ok:#6CC497; --ok-bg:#16271E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121518; --surface:#1A1F24; --ink:#E4E8EC; --muted:#98A3AD; --line:#2C343B;
  --accent:#7FA8D6; --accent-ink:#0E1620; --warn:#E0A458; --warn-bg:#2B2217; --ok:#6CC497; --ok-bg:#16271E;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.7}
main{max-width:680px;margin:0 auto;padding:48px 24px 72px}
main.center{min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;justify-content:center;padding:40px 24px}
main.center > *{flex:none}
.lead-q{font-size:19px;line-height:1.7;margin-bottom:16px}
h1{font-size:30px;line-height:1.3;font-weight:700;margin:0 0 12px;letter-spacing:-.01em}
h2{font-size:20px;line-height:1.4;font-weight:700;margin:32px 0 10px}
p{margin:0 0 12px}
.muted{color:var(--muted)}
.small{font-size:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 22px;margin:20px 0}
.readout{display:grid;grid-template-columns:max-content 1fr;gap:6px 18px;margin:0}
.readout dt{color:var(--muted)}
.readout dd{margin:0;font-variant-numeric:tabular-nums}
.st-ok{color:var(--ok)} .st-bad{color:var(--warn)}
.note{border-radius:8px;padding:12px 14px;margin:14px 0;background:var(--warn-bg);color:var(--ink)}
.note.ok{background:var(--ok-bg)}
button,.btn{font:inherit;font-weight:500;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 18px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.linkish{background:none;border:none;color:var(--muted);text-decoration:underline;padding:4px 0;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label.check{display:flex;gap:10px;align-items:flex-start;margin:16px 0}
label.check input{margin-top:6px}
textarea{width:100%;min-height:130px;font:inherit;padding:12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.form{display:grid;grid-template-columns:1fr 160px;gap:10px 16px;align-items:center}
.form input,.form select{font:inherit;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
.form .hint{grid-column:1 / -1;margin-top:-6px;font-size:13px;color:var(--muted)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;white-space:nowrap}
th{color:var(--muted);font-weight:500}
ol.steps{padding-left:22px} ol.steps li{margin:4px 0}

/* Stimulus stage: fixed colours, independent of theme, identical for every participant */
#stage{position:fixed;inset:0;background:#000;color:#fff;display:none;align-items:center;justify-content:center;z-index:50;font-family:var(--font)}
#stage.on{display:flex}
#stage.presenting{cursor:none}
#cv{width:400px;height:400px;display:block}
#resp{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:18px;padding:24px;text-align:center}
#resp.on{display:flex}
#resp .q{font-size:22px;font-weight:500}
#resp input{font:inherit;font-size:28px;width:200px;text-align:center;padding:8px;border-radius:8px;border:1px solid #666;background:#111;color:#fff;font-variant-numeric:tabular-nums}
#resp .err{min-height:24px;color:#F2B266;font-size:15px}
#resp button{background:#fff;color:#000;border-color:#fff}
#resp .choices{display:flex;gap:28px}
#resp .choices button{font-size:30px;min-width:150px;padding:14px 20px;font-variant-numeric:tabular-nums}
#resp .keyhint{color:#AAA;font-size:14px}
@media (max-width:560px){ .form{grid-template-columns:1fr} h1{font-size:25px} }
@media (prefers-reduced-motion:reduce){ *{scroll-behavior:auto} }
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>

<div id="stage" aria-hidden="true">
  <canvas id="cv"></canvas>
  <div id="resp"></div>
</div>

<script id="main-script">
(function(){
"use strict";

/* ---------- settings ---------- */
const DEFAULTS = {
  assignment: "balanced",      // 가시성 조건 배정: balanced | readable | brief
  cueMs: 1000,                 // 고정점(+) 제시

/* Timestamps are recorded in Korea Standard Time, e.g. 2026-11-13T15:04:05+09:00 */
function kstNow(){ return new Date(Date.now()+9*3600*1000).toISOString().slice(0,19)+"+09:00"; }         // set when this file is made by "현재 설정으로 HTML 내려받기"
const ANCHORS = []; for(let v=100; v<=900; v+=20) ANCHORS.push(v);   // numbers used only in the final visibility check

/* Fixed stimulus lists (5 lists × 81 trials = 405 stimuli).
   diff = anchor dots − target dots, −400 to +400 in steps of 10 (81 levels); anchor = target + diff.
   Target counts 490/495/500/505/510 rotate across lists (Latin square): in list k, trial i has
   TARGET_LEVELS[(i−1+k) mod 5]. So every diff × target pair appears exactly once across the 5 lists,
   and any 3 lists give each diff 3 different target counts. Matches the team's mapping sheet. */
const DIFFS = []; for(let d=-400; d<=400; d+=10) DIFFS.push(d);
const LIST_NAMES = ["A","B","C","D","E"];
const TARGET_LEVELS = [490,495,500,505,510];
function listsCount(){ return Math.min(LIST_NAMES.length, Math.max(1, settings.listsPerParticipant|0 || 3)); }
function stimList(name){
  const k = LIST_NAMES.indexOf(name);
  return DIFFS.map((diff,i)=>{
    const target = TARGET_LEVELS[(i+k)%5];
    return { list:name, trialId:i+1, diff, target, anchor: target+diff,
             imageId:`${name}-${String(i+1).padStart(2,"0")}` };
  });
}
const LS = { sessions:"dotAnchor.sessions.v1", current:"dotAnchor.current.v1", settings:"dotAnchor.settings.v1", counts:"dotAnchor.assign.v1", listCounts:"dotAnchor.assignList.v1" };
function lsGet(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch(e){ return false; } }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }

// Saved settings only apply to the same file version, so a freshly exported file starts from its own defaults.

delete settings._defaultsId;
function saveSettings(){ return lsSet(LS.settings, Object.assign({_defaultsId:DEFAULTS_ID}, settings)); }

(function recover(){

    cur.events.push({type:"reload", at:kstNow(), trial:cur.trials.length});

const $app = document.getElementById("app");

const $resp = document.getElementById("resp");

let DPR = 1;

function rid(n){ const c="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let s=""; const a=new Uint32Array(n); crypto.getRandomValues(a); for(const x of a) s+=c[x%c.length]; return s; }
function randInt(a,b){ return a+Math.floor(Math.random()*(b-a+1)); }
function shuffle(arr){ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
const nextFrame = () => new Promise(r=>requestAnimationFrame(r));
async function hold(frames){ let t; for(let i=0;i<frames;i++) t = await nextFrame(); return t; }
function framesFor(ms){ return Math.max(1, Math.round(ms / timing.frameMs)); }
const sleep = ms => new Promise(r=>setTimeout(r,ms));

async function measureRefresh(){
  let prev = await nextFrame(); const d=[];
  for(let i=0;i<100;i++){ const t=await nextFrame(); d.push(t-prev); prev=t; }
  d.sort((a,b)=>a-b);
  const med = d[Math.floor(d.length/2)];
  timing.frameMs = med; timing.hz = 1000/med;
  return timing;
}
function envInfo(){
  return { ua:navigator.userAgent, screenW:screen.width, screenH:screen.height, vw:innerWidth, vh:innerHeight, dpr:window.devicePixelRatio||1 };
}
function looksMobile(){
  const ua = navigator.userAgent;
  if(/Android|iPhone|iPad|iPod|Mobile|Tablet|Silk|Kindle/i.test(ua)) return true;
  if(/Macintosh/.test(ua) && navigator.maxTouchPoints>1) return true;   // iPadOS
  const coarseOnly = matchMedia("(pointer: coarse)").matches && !matchMedia("(any-pointer: fine)").matches;
  return coarseOnly;
}

/* ---------- stimulus drawing ---------- */
function sizeCanvas(){
  DPR = window.devicePixelRatio||1;
  $cv.style.width = IMG_W+"px"; $cv.style.height = IMG_H+"px";
  $cv.width = Math.round(IMG_W*DPR); $cv.height = Math.round(IMG_H*DPR);
}
function seededRandom(seedText){
  let h=1779033703 ^ seedText.length;
  for(let i=0;i<seedText.length;i++){ h=Math.imul(h ^ seedText.charCodeAt(i), 3432918353); h=(h<<13)|(h>>>19); }
  let a=h>>>0;
  return ()=>{ a=(a+0x6D2B79F5)>>>0; let t=a; t=Math.imul(t^(t>>>15), t|1); t^=t+Math.imul(t^(t>>>7), t|61); return ((t^(t>>>14))>>>0)/4294967296; };
}
/* seed given: the same layout for every participant (e.g. image "A-07"); no seed: a fresh random layout. */
function makeDotsImage(n, seed){
  const rnd = seed ? seededRandom("dots:"+seed) : Math.random;
  const W=$cv.width, H=Math.round(IMG_H*DPR), r=1.6*DPR, minD=5*DPR, pad=6*DPR;
  const pts=[]; let tries=0;
  while(pts.length<n && tries<200000){
    tries++;
    const x=pad+rnd()*(W-2*pad), y=pad+rnd()*(H-2*pad);
    let ok=true;
    for(let i=0;i<pts.length;i++){ const dx=pts[i][0]-x, dy=pts[i][1]-y; if(dx*dx+dy*dy<minD*minD){ ok=false; break; } }
    if(ok) pts.push([x,y]);
  }
  const off=document.createElement("canvas"); off.width=W; off.height=H;
  const c=off.getContext("2d"); c.fillStyle="#000"; c.fillRect(0,0,W,H); c.fillStyle="#fff";
  for(const [x,y] of pts){ c.beginPath(); c.arc(x,y,r,0,Math.PI*2); c.fill(); }
  return { canvas:off, count:pts.length };
}
function clearStage(){ ctx.fillStyle="#000"; ctx.fillRect(0,0,$cv.width,$cv.height); }
function numFont(){ return `700 ${Math.round(48*DPR)}px "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif`; }
function drawFixation(){
  clearStage(); ctx.fillStyle="#fff";
  const cx=$cv.width/2, cy=Math.round(IMG_H*DPR)/2, arm=Math.round(12*DPR), w=Math.max(2,Math.round(2*DPR));
  ctx.fillRect(Math.round(cx-arm), Math.round(cy-w/2), arm*2, w);
  ctx.fillRect(Math.round(cx-w/2), Math.round(cy-arm), w, arm*2);
}
function drawLabel(label){
  clearStage();
  if(label){
    ctx.fillStyle="#fff"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.font=numFont();
    ctx.fillText(label, $cv.width/2, $cv.height/2);
  }
}
const FILLER_SET = "CDFHJKMNPQRTVWXY";   // 숫자와 헷갈리는 O, I, S, Z, B, G, L 제외
function makeFiller(){
  const pool = FILLER_SET.split(""); shuffle(pool); return pool.slice(0,3).join("");
}

function usesString(condition){ return condition==="brief"; }
function usesBlankFlash(condition){ return condition==="readable" && !!settings.supraFlash; }
function showsString(condition){ return condition==="brief" || condition==="none"; }   // what the participant sees in the label phase
function condName(c){ return c==="brief" ? "subliminal" : c==="none" ? "no_anchor" : "supraliminal"; }

/* One presentation sequence: fixation -> number or string -> dot image -> (question).
   subliminal, anchor:      string stays on; the anchor replaces it for briefMs (whole frames), flashCount times.
   supraliminal, anchor:    the anchor stays on for the whole label phase.
   supraliminal + flash:    the anchor stays on; a blank screen replaces it for briefMs, flashCount times.
   no anchor (incl. practice):
     subliminal, or supraliminal + flash: string stays on; a blank screen replaces it for briefMs, flashCount times.
     supraliminal, flash off: blank screen for the whole label phase.
   no-anchor group (condition "none"): always the string with blank flashes, never a number. */
async function presentSequence(anchor, dotsN, condition, opts={}){
  const img = makeDotsImage(dotsN, opts.seed);
  const fr = timing.frameMs;
  if(condition==="none") anchor = null;
  const stringMode = usesString(condition);
  const blankMode = usesBlankFlash(condition);
  const nLabel = framesFor(settings.labelMs);
  const nFlash = framesFor(settings.briefMs);
  const nImg = framesFor(settings.imageMs);
  const noneGroup = condition==="none";
  const noneString = anchor===null && (stringMode || blankMode || noneGroup);   // no-anchor: string with blank flashes
  const filler = (stringMode || noneString) ? makeFiller() : "";
  const base = (stringMode || noneString) ? filler : (anchor===null ? "" : String(anchor));
  const flashContent = (stringMode && anchor!==null) ? String(anchor) : "";
  const flashAt = [];
  if(stringMode || blankMode || noneGroup){
    let k = Math.max(1, settings.flashCount|0);
    while(k>1 && nLabel/(k+1) < nFlash+3) k--;           // keep flashes separated
    for(let i=1;i<=k;i++){
      let at = Math.round(nLabel*i/(k+1));
      at = Math.max(1, Math.min(at, nLabel-nFlash-1));    // base visible before and after
      if(!flashAt.length || at >= flashAt[flashAt.length-1]+nFlash+1) flashAt.push(at);
    }
  }
  $stage.classList.add("presenting");
  trialFlags.hidden = false;

  await nextFrame(); drawFixation();
  let t = await hold(framesFor(settings.cueMs));
  drawLabel(base);                                      // number / string onset
  const tL = t;
  const flashDur = [], flashOn = [];
  let f = 0, fi = 0;
  while(f < nLabel){
    if(fi < flashAt.length && f === flashAt[fi]){
      drawLabel(flashContent);                          // subliminal: number in; supraliminal: blank in
      const tOn = t;
      t = await hold(nFlash); f += nFlash;
      drawLabel(base);                                  // back to string / number
      flashDur.push(t - tOn); flashOn.push(tOn - tL); fi++;
      continue;
    }
    t = await nextFrame(); f++;
  }
  const labelMeasured = t - tL;
  let imageMeasured = "";
  if(opts.noImage){
    clearStage();                                       // visibility check: no dot image
  } else {
    ctx.drawImage(img.canvas,0,0);                      // image onset
    const tImg = t;
    t = await hold(nImg);
    clearStage();                                       // image offset
    imageMeasured = t - tImg;
  }
  $stage.classList.remove("presenting");

  const flashesOk = flashDur.every(d=>Math.abs(d-nFlash*fr) <= fr*0.5);
  let anchorMeasured="", anchorMax="", timingOk;
  if(anchor===null){
    timingOk = flashesOk && !trialFlags.hidden;
  } else if(stringMode){
    if(flashDur.length){
      anchorMeasured = +(flashDur.reduce((a,b)=>a+b,0)/flashDur.length).toFixed(2);
      anchorMax = +Math.max(...flashDur).toFixed(2);
    }
    timingOk = flashesOk && !trialFlags.hidden;
  } else {
    {
      const blankTotal = flashDur.reduce((a,b)=>a+b,0);
      anchorMeasured = +(labelMeasured - blankTotal).toFixed(1); anchorMax = anchorMeasured;   // time the number was on screen
    }
    timingOk = Math.abs(labelMeasured-nLabel*fr) <= fr*1.5 && flashesOk && !trialFlags.hidden;
  }
  return {
    targetDots: opts.noImage ? "" : img.count,
    anchorDisplay: anchor===null ? (noneString ? "none_string_blank_flash" : "none_blank") : (stringMode ? "flash_in_string" : (blankMode ? "continuous_blank_flash" : "continuous")),
    anchorFrames: anchor===null ? "" : (stringMode ? nFlash : nLabel),
    anchorTargetMs: anchor===null ? "" : (stringMode ? settings.briefMs : settings.labelMs),
    anchorMeasuredMs: anchorMeasured, anchorMeasuredMaxMs: anchorMax,
    flashCount: flashDur.length, flashOnsetsMs: flashOn.map(x=>Math.round(x)).join(";"), filler,
    labelMeasuredMs:+labelMeasured.toFixed(1), imageMeasuredMs: imageMeasured==="" ? "" : +imageMeasured.toFixed(1), timingOk, tabHidden:trialFlags.hidden
  };
}

function askEstimate(){
  return new Promise(async resolve=>{
    $resp.innerHTML = `<div class="q">그림에 흰 점이 몇 개 있었나요?</div>
      <input id="est" type="text" inputmode="numeric" autocomplete="off" aria-label="추정한 점 개수">
      <div class="err" id="err"></div>
      <button id="go" type="button">다음</button>`;
    await nextFrame();
    $resp.classList.add("on");
    const t0 = performance.now();
    const inp=$resp.querySelector("#est"), err=$resp.querySelector("#err");
    inp.focus();
    const submit=()=>{
      const v=inp.value.trim();
      if(!/^\d{1,5}$/.test(v) || +v<1){ err.textContent="1 이상의 숫자만 입력해 주세요."; inp.focus(); return; }
      const rt = performance.now()-t0;
      $resp.classList.remove("on"); $resp.innerHTML="";
      resolve({ estimate:+v, rtMs:Math.round(rt) });
    };
    $resp.querySelector("#go").onclick=submit;
    inp.addEventListener("keydown",e=>{ if(e.key==="Enter") submit(); });
  });
}
function askChoice(left,right){
  return new Promise(async resolve=>{
    $resp.innerHTML = `<div class="q">방금 화면에 나온 숫자는 무엇이었나요?</div>
      <div class="choices"><button id="cl" type="button">${left}</button><button id="cr" type="button">${right}</button></div>
      <div class="keyhint">F 키는 왼쪽, J 키는 오른쪽입니다. 잘 보이지 않았다면 짐작해서 골라 주세요.</div>`;
    await nextFrame();
    $resp.classList.add("on");
    const t0=performance.now();
    const done=v=>{ document.removeEventListener("keydown",key); $resp.classList.remove("on"); $resp.innerHTML=""; resolve({choice:v, rtMs:Math.round(performance.now()-t0)}); };
    const key=e=>{ if(e.key==="f"||e.key==="F") done(left); if(e.key==="j"||e.key==="J") done(right); };
    document.addEventListener("keydown",key);
    $resp.querySelector("#cl").onclick=()=>done(left);
    $resp.querySelector("#cr").onclick=()=>done(right);
  });
}

/* ---------- session ---------- */
function saveCurrent(){ if(session) session.storageOk = lsSet(LS.current, session) && session.storageOk!==false; }
/* Balanced random: the level with the fewest assignments on this device; ties broken at random. */
function pickBalanced(levels, counts){
  const min = Math.min(...levels.map(l=>counts[l]||0));
  const low = levels.filter(l=>(counts[l]||0)===min);
  return low[Math.floor(Math.random()*low.length)];
}
function pickCondition(){
  const levels=["readable","brief"];
  if(levels.includes(settings.assignment)) return settings.assignment;
  return pickBalanced(levels, lsGet(LS.counts,{}));
}
/* Three of the five lists. Fixed if set in the researcher screen; otherwise the lists used least
   on this device, ties at random. Block order is shuffled. */
function parseLists(v, n){
  n = n || listsCount();
  const t = String(v||"").toUpperCase().replace(/[^A-E]/g,"");
  return (t.length===n && new Set(t).size===n) ? t.split("") : null;
}
function pickLists(){
  const fixed = parseLists(settings.listAssignment);
  if(fixed) return shuffle(fixed.slice());
  const c = lsGet(LS.listCounts,{});
  const order = shuffle(LIST_NAMES.slice()).sort((a,b)=>(c[a]||0)-(c[b]||0));   // shuffle first so ties are random
  return shuffle(order.slice(0, listsCount()));
}
function newSession(){
  const condition = pickCondition(), lists = pickLists();
  const c = lsGet(LS.counts,{}); c[condition]=(c[condition]||0)+1; lsSet(LS.counts,c);
  const lc = lsGet(LS.listCounts,{}); for(const L of lists) lc[L]=(lc[L]||0)+1; lsSet(LS.listCounts,lc);
  return {
    sessionId: rid(10), participantId: "P-"+rid(6), condition, lists, status:"running",
    test: !!settings.quickMode, startedAt:kstNow(), finishedAt:"",
    settings: Object.assign({},settings), env: envInfo(), timing:Object.assign({},timing),
    fullscreen:false, events:[], trials:[], survey:{suspicion:""}, interruptions:0, storageOk:true
  };
}
document.addEventListener("visibilitychange",()=>{
  if(!running||!session) return;
  if(document.hidden){ trialFlags.hidden=true; session.events.push({type:"hidden", at:kstNow(), trial:session.trials.length+1}); saveCurrent(); }
});

async function enterStage(){
  sizeCanvas(); clearStage();
  $stage.classList.add("on");
  try{ await document.fonts.load(numFont()); }catch(e){}
  await sleep(300);
}
function leaveStage(){ $stage.classList.remove("on","presenting"); $resp.classList.remove("on"); }

let blockActive = false;     // only one presentation block may run at a time
function onceClick(id, fn){
  const b = document.getElementById(id);
  b.onclick = async ()=>{ if(b.disabled || blockActive) return; b.disabled = true; await fn(); };
}
async function runEstimationBlock(phase, list, blockNo){
  if(blockActive) return; blockActive = true;
  try{
  await enterStage();
  for(let i=0;i<list.length;i++){
    // item: {trialId, diff, target, anchor, imageId} from the fixed list, or null for a practice trial
    const item = list[i];
    const target = item ? item.target : TARGET_LEVELS[randInt(0, TARGET_LEVELS.length-1)];
    // practice: supraliminal shows a number too (target + a random list difference), so practice looks like the main trials
    const shown = item ? (session.condition!=="none" ? item.anchor : null)
                       : (session.condition==="readable" ? target + DIFFS[randInt(0, DIFFS.length-1)] : null);
    const pres = await presentSequence(shown, target, session.condition, {seed: item ? item.imageId : null});
    const ans = await askEstimate();
    session.trials.push(Object.assign({
      phase, trialIndex: session.trials.length+1,
      trialInPhase: session.trials.filter(t=>t.phase===phase).length+1,
      block: blockNo || "",
      listName: item ? item.list : "", trialId: item ? item.trialId : "", imageId: item ? item.imageId : "",
      anchorDiff: item ? item.diff : "", plannedAnchor: item ? item.anchor : "",
      anchorShown: shown===null ? 0 : 1,
      anchorType: shown===null?"none":"anchor", anchor: shown===null?"":shown,
      anchorMinusTarget: shown===null?"":shown-pres.targetDots
    }, pres, ans));
    saveCurrent();
    clearStage(); await sleep(settings.itiMs);
  }
  leaveStage();
  } finally { blockActive = false; }
}
async function runVisibilityBlock(n){
  if(blockActive) return; blockActive = true;
  try{
  await enterStage();
  const pool = shuffle(ANCHORS.slice());
  for(let i=0;i<n;i++){
    const target = pool[i % pool.length];
    const foils = ANCHORS.filter(v=>Math.abs(v-target)>=100);
    const foil = foils[randInt(0,foils.length-1)];
    const left = Math.random()<.5?target:foil, right = left===target?foil:target;
    const pres = await presentSequence(target, 0, session.condition, {noImage:true});
    const ans = await askChoice(left,right);
    session.trials.push(Object.assign({
      phase:"visibility", trialIndex:session.trials.length+1, trialInPhase:i+1,
      anchorType:"anchor", anchor:target, anchorMinusTarget:"",
      visLeft:left, visRight:right, visChoice:ans.choice, visCorrect: ans.choice===target?1:0
    }, pres, {rtMs:ans.rtMs}));
    saveCurrent();
    clearStage(); await sleep(settings.itiMs);
  }
  leaveStage();
  } finally { blockActive = false; }
}

  "estimate","rt_ms","anchor_frames","anchor_target_ms","anchor_display","anchor_measured_ms","anchor_measured_max_ms","flash_count","flash_onsets_ms","filler_string","label_measured_ms","image_measured_ms",
  "timing_ok","tab_hidden","vis_left","vis_right","vis_choice","vis_correct",
  "frame_ms","refresh_hz","main_trials_per_participant","label_ms","image_ms","brief_target_ms","supra_blank_flash_ms","flashes_per_trial","fullscreen",

function sessLists(s){ return (s.lists||[]).join("") || s.list || ""; }
function cell(v){ if(v===undefined||v===null) return ""; const s=String(v); return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }
function sessionRows(s){
  const base = {

function toCsv(sessions){
  const lines=[COLS.join(",")];
  for(const s of sessions) for(const r of sessionRows(s)) lines.push(COLS.map(c=>cell(r[c])).join(","));
  return lines.join("\r\n");
}
async function offerCsv(filename, text){ return offerFile(filename, "\ufeff"+text, "text/csv"); }
async function offerFile(filename, data, mime){
  try{
    if(window.claude && typeof window.claude.use==="function"){
      const dl = await window.claude.use("downloads");
      if(dl){ await dl.save({filename, data}); return "saved"; }
    }
  }catch(e){ if(e && e.code==="declined") return "declined"; }
  try{
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([data],{type:mime})); a.download=filename;
    document.body.appendChild(a); a.click(); a.remove();
    return "fallback";
  }catch(e){ return "failed"; }
}
/* ---------- upload to Google Sheets (Apps Script web app) ---------- */
function endpoint(){ const u=(settings.endpointUrl||"").trim(); return /^https:\/\//.test(u) ? u : ""; }
function inClaudeViewer(){ return !!(window.claude && typeof window.claude.use==="function"); }
function markUploaded(id, state){
  const all=lsGet(LS.sessions,[]); const x=all.find(z=>z.sessionId===id);
  if(x){ x.uploaded=state; lsSet(LS.sessions,all); }
}
async function postJson(url, payload){
  const body=JSON.stringify(payload);
  try{
    const res=await fetch(url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body});
    const j=await res.json().catch(()=>null);
    if(res.ok && j && j.ok) return "ok";
    return "failed";
  }catch(e){
    // The browser may hide the reply even when the sheet received it; send once more without reading it.
    try{ await fetch(url,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body}); return "unconfirmed"; }
    catch(e2){ return "failed"; }
  }
}
async function uploadSession(s){
  const url=endpoint(); if(!url) return "off";
  const rows=sessionRows(s).map(r=>COLS.map(c=>(r[c]===undefined||r[c]===null)?"":r[c]));
  const r=await postJson(url,{sessionId:s.sessionId, columns:COLS, rows});
  if(r!=="failed"){ s.uploaded=r; markUploaded(s.sessionId,r); }
  return r;
}
async function flushUnsent(){
  if(!endpoint()) return 0;
  const pending=lsGet(LS.sessions,[]).filter(x=>x.uploaded!=="ok" && x.uploaded!=="unconfirmed");
  let n=0; for(const x of pending){ if(await uploadSession(x)!=="failed") n++; }
  return n;
}

/* A copy of this page whose DEFAULTS are the current settings (comments kept). */
function buildConfiguredHtml(){
  let js = document.getElementById("main-script").textContent;
  const css = document.getElementById("main-style").textContent;
  const a = js.indexOf("const DEFAULTS = {"), b = js.indexOf("\n};", a);
  let block = js.slice(a, b);
  for(const k of Object.keys(DEFAULTS)){
    const v = JSON.stringify(settings[k]===undefined ? DEFAULTS[k] : settings[k]);
    block = block.replace(new RegExp("(\\n\\s*"+k+":\\s*)[^,\\n]+"), (m,pre)=>pre+v);
  }
  js = js.slice(0,a) + block + js.slice(b);
  js = js.replace(/const DEFAULTS_ID = "[^"]*";/, "const DEFAULTS_ID = "+JSON.stringify("v"+stamp()+"-"+rid(4))+";");
  const SC = "<"+"/script>", ST = "<"+"/style>";
  return "<!doctype html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"utf-8\">\n"
    + "<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n"
    + "<title>"+esc(document.title)+"</title>\n<style id=\"main-style\">"+css+ST+"\n</head>\n<body>\n"
    + "<main id=\"app\" aria-live=\"polite\"></main>\n\n<div id=\"stage\" aria-hidden=\"true\">\n  <canvas id=\"cv\"></canvas>\n  <div id=\"resp\"></div>\n</div>\n\n"
    + "<script id=\"main-script\">"+js+SC+"\n</body>\n</html>\n";
}

        <thead><tr><th><input type="checkbox" id="selAll" aria-label="전체 선택"></th><th>참여 번호</th><th>조건</th><th>목록</th><th>상태</th><th>본 시행</th><th>시간 이탈</th><th>확인 과제 정답률</th><th>주사율</th><th>시작</th><th>시트 전송</th></tr></thead>
        <tbody>${rows}</tbody></table></div>`:""}
    </div>

    <h2>화면 점검</h2>
    <div class="panel">
      <p id="tm">주사율을 측정하면 짧은 조건에서 숫자가 몇 프레임 동안 보이는지 확인할 수 있습니다.</p>
      <div class="row"><button id="meas">주사율 측정</button><button id="demoB">subliminal 미리 보기</button><button id="demoR">supraliminal 미리 보기</button></div>
    </div>

    <h2>실험 설정</h2>
    <div class="panel">
      <div class="form">
        <label for="s_assign">조건 배정</label>
        <select id="s_assign"><option value="balanced">무작위 (이 기기에서 인원 균형)</option><option value="readable">supraliminal로 고정</option><option value="brief">subliminal로 고정</option></select>
        <label for="s_nl">참가자당 목록 수</label>
        <div class="row" style="gap:6px;flex-wrap:nowrap"><button type="button" id="s_nlminus" aria-label="하나 줄이기" style="padding:6px 12px">−</button><input id="s_nl" type="number" min="1" max="5" step="1" style="text-align:center"><button type="button" id="s_nlplus" aria-label="하나 늘리기" style="padding:6px 12px">+</button></div>
        <div class="hint" id="s_nlhint"></div>
        <label for="s_list">고정할 목록</label>
        <input id="s_list" type="text" maxlength="5" placeholder="비워 두면 무작위" style="text-transform:uppercase">
        <div class="hint">비워 두면 이 기기에서 덜 쓰인 목록 위주로 무작위로 고릅니다. ACE처럼 목록 수만큼 적으면 그 목록으로 고정합니다. 묶음 순서와 묶음 안의 시행 순서는 무작위이며, 가시성 조건과는 따로 배정됩니다.</div>
        <label for="s_cue">고정점(+) 제시 (ms)</label><input id="s_cue" type="number" min="0" step="100">
        <label for="s_img">점 그림 제시 (ms)</label><input id="s_img" type="number" min="100" step="100">
        <label for="s_label">숫자·문자열 화면 제시 (ms)</label><input id="s_label" type="number" min="100" step="100">
        <div class="hint">고정점과 그림 사이에 숫자 또는 알파벳 세 글자가 나오는 시간입니다. 깜빡임 없는 supraliminal 조건에서는 이 시간 내내 숫자가 보입니다.</div>
        <label for="s_brief">깜빡임 시간 (ms)</label><input id="s_brief" type="number" min="1" step="1">
        <div class="hint">subliminal에서 숫자가 나오는 시간이고, supraliminal 빈 화면 깜빡임을 켜면 빈 화면이 끼어드는 시간으로도 쓰입니다. 화면 프레임 단위로 반올림되며, 60Hz에서 17ms는 1프레임(약 16.7ms)입니다.</div>
        <label for="s_sf">supraliminal 빈 화면 깜빡임</label><select id="s_sf"><option value="0">끄기 (숫자만 계속 표시)</option><option value="1">켜기 (숫자 사이에 빈 화면이 깜빡임)</option></select>
        <div class="hint">켜면 supraliminal 조건에서 숫자가 계속 보이다가, 위의 깜빡임 시간과 아래 깜빡임 횟수대로 빈 화면이 끼어듭니다. 두 조건의 화면 깜빡임을 맞추기 위한 옵션입니다.</div>
        <label for="s_flash">깜빡임 횟수</label><input id="s_flash" type="number" min="1" max="10" step="1">
        <div class="hint">숫자·문자열 화면을 같은 간격으로 나눠 깜빡임이 들어갑니다. 1이면 화면 한가운데 시점에서 한 번입니다. 깜빡임을 쓰는 조건에 모두 적용됩니다.</div>
        <label for="s_iti">시행 사이 빈 화면 (ms)</label><input id="s_iti" type="number" min="0" step="100">
        <label for="s_prac">연습 시행 수 (숫자 없음)</label><input id="s_prac" type="number" min="0" max="10" step="1">
        <label for="s_vis">확인 과제 시행 수</label><input id="s_vis" type="number" min="0" max="41" step="1">
        <label for="s_quick">빠른 점검 모드 (본 시행 6회, 한 묶음)</label><select id="s_quick"><option value="0">끄기</option><option value="1">켜기</option></select>
        <label for="s_dev">기기·창 크기 제한</label><select id="s_dev"><option value="0">적용</option><option value="1">끄기 (점검용)</option></select>
        <label for="s_pin">연구자 화면 새 비밀번호 (숫자 4자리)</label><input id="s_pin" type="password" inputmode="numeric" maxlength="4" autocomplete="new-password" placeholder="바꿀 때만 입력">
        <div class="hint">비워 두면 지금 비밀번호가 유지됩니다. 기본 비밀번호는 0000입니다.</div>
        <label for="s_url" style="grid-column:1 / -1">구글 스프레드시트 전송 주소 (Apps Script 웹 앱 URL)</label>
        <input id="s_url" type="url" placeholder="https://script.google.com/macros/s/…/exec" style="grid-column:1 / -1">
        <div class="hint">비워 두면 전송하지 않습니다. 주소를 넣으면 참여가 끝날 때 결과가 시트에 자동으로 쌓이고, 전송하지 못한 세션은 다음에 시작 화면을 열 때 다시 보냅니다. claude.ai에서 연 페이지는 외부 전송이 막혀 있으니, 내려받은 HTML을 호스팅한 주소에서 사용해 주세요.</div>
        <div class="row" style="grid-column:1 / -1"><button type="button" id="urlTest">전송 테스트</button><button type="button" id="flush">전송 안 된 세션 다시 보내기</button><span class="small muted" id="urlMsg"></span></div>
      </div>
      <p class="small" id="warn" style="margin:12px 0 0"></p>
      <div class="row" style="margin-top:14px"><button class="primary" id="save">설정 저장</button><button id="reset">기본값으로</button><button id="dlHtml">현재 설정으로 HTML 내려받기</button></div>
      <p class="small muted" id="htmlMsg" style="margin:10px 0 0">위 설정을 저장한 뒤, 그 설정이 기본값으로 들어간 HTML 파일을 내려받습니다. 그 파일은 어느 컴퓨터에서 열어도 이 설정으로 시작합니다. 참여 데이터는 파일에 들어가지 않습니다.</p>
    </div>
    <p><button class="linkish" id="back">참여자 시작 화면으로</button></p>`;

  const g=id=>document.getElementById(id);
  g("s_assign").value=f.assignment; g("s_cue").value=f.cueMs; g("s_img").value=f.imageMs; 
  g("s_brief").value=f.briefMs; g("s_flash").value=f.flashCount; g("s_label").value=f.labelMs; g("s_sf").value=f.supraFlash?"1":"0";
  g("s_iti").value=f.itiMs; g("s_prac").value=f.practiceTrials; g("s_vis").value=f.visTrials; g("s_quick").value=f.quickMode?"1":"0"; g("s_list").value=parseLists(f.listAssignment)?f.listAssignment:""; g("s_nl").value=listsCount();
  const nlClamp=v=>Math.min(5,Math.max(1,Math.round(+v||1)));
  const nlHint=()=>{ const n=nlClamp(g("s_nl").value); g("s_nlhint").textContent=`목록 A~E 중 ${n}개를 배정합니다. 목록 하나가 한 묶음(81회)이라, 본 시행은 모두 ${81*n}회입니다.`; };
  g("s_nlminus").onclick=()=>{ g("s_nl").value=nlClamp(+g("s_nl").value-1); nlHint(); };
  g("s_nlplus").onclick=()=>{ g("s_nl").value=nlClamp(+g("s_nl").value+1); nlHint(); };
  g("s_nl").oninput=nlHint; nlHint(); g("s_url").value=f.endpointUrl||""; g("s_dev").value=f.allowAnyDevice?"1":"0";
  g("save").onclick=()=>{
    const newPin=g("s_pin").value.trim();
    if(newPin && !/^\d{4}$/.test(newPin)){ g("warn").className="small st-bad"; g("warn").textContent="비밀번호는 숫자 4자리로 입력해 주세요. 설정을 저장하지 않았습니다."; g("s_pin").focus(); return false; }
    const keepPin = newPin ? pinHash(newPin) : settings.pinHash;
    const listRaw = g("s_list").value.trim();
    const nl = Math.min(5,Math.max(1,Math.round(+g("s_nl").value||3)));
    if(listRaw && !parseLists(listRaw, nl)){ g("warn").className="small st-bad"; g("warn").textContent=`고정할 목록은 A~E 중 서로 다른 ${nl}개로 적거나 비워 두세요. 설정을 저장하지 않았습니다.`; g("s_list").focus(); return false; }
    settings = {
      assignment:g("s_assign").value, cueMs:+g("s_cue").value, imageMs:+g("s_img").value, 
      briefMs:+g("s_brief").value, labelMs:+g("s_label").value, supraFlash:g("s_sf").value==="1", flashCount:Math.min(10,Math.max(1,Math.round(+g("s_flash").value||1))),
      itiMs:+g("s_iti").value, practiceTrials:+g("s_prac").value, visTrials:+g("s_vis").value, quickMode:g("s_quick").value==="1", listsPerParticipant: nl, listAssignment: listRaw ? parseLists(listRaw, nl).join("") : "balanced", endpointUrl:g("s_url").value.trim(), allowAnyDevice:g("s_dev").value==="1", pinHash:keepPin
    };
    saveSettings(); g("msg").textContent=""; screenResearcher(); g("msg").textContent = newPin ? "설정을 저장했습니다. 비밀번호도 바뀌었습니다." : "설정을 저장했습니다.";
    return true;
  };
  g("urlTest").onclick=async()=>{
    const u=g("s_url").value.trim();
    if(!/^https:\/\//.test(u)){ g("urlMsg").textContent="https://로 시작하는 주소를 넣어 주세요."; return; }
    if(inClaudeViewer()){ g("urlMsg").textContent="claude.ai에서 연 페이지에서는 외부 전송이 막혀 있습니다. 내려받은 HTML을 호스팅한 주소에서 테스트해 주세요."; return; }
    g("urlMsg").textContent="보내는 중…";
    const r=await postJson(u,{test:true});
    g("urlMsg").textContent = r==="ok" ? "연결되었습니다. 시트에 데이터를 받을 수 있습니다." : r==="unconfirmed" ? "요청은 보냈지만 응답을 확인하지 못했습니다. 웹 앱 배포 설정(액세스: 모든 사용자)을 확인해 주세요." : "연결하지 못했습니다. 주소와 배포 설정을 확인해 주세요.";
  };
  g("flush").onclick=async()=>{
    if(!endpoint()){ g("urlMsg").textContent="먼저 전송 주소를 넣고 설정을 저장해 주세요."; return; }
    if(inClaudeViewer()){ g("urlMsg").textContent="claude.ai에서 연 페이지에서는 외부 전송이 막혀 있습니다."; return; }
    g("urlMsg").textContent="보내는 중…";
    const n=await flushUnsent(); screenResearcher(); document.getElementById("urlMsg").textContent=`세션 ${n}개를 보냈습니다.`;
  };
  g("dlHtml").onclick=async()=>{
    if(g("save").onclick()===false) return;               // save the form first (re-renders this screen)
    const r = await offerFile(`dot-anchor-pilot_${stamp()}.html`, buildConfiguredHtml(), "text/html");
    const m = document.getElementById("htmlMsg");
    m.textContent = r==="declined" ? "내려받기를 취소했습니다." : r==="failed" ? "내려받지 못했습니다." : "설정을 저장하고, 이 설정이 기본값으로 들어간 HTML 파일을 내려받았습니다.";
  };
  g("reset").onclick=()=>{ settings=Object.assign({},DEFAULTS); saveSettings(); screenResearcher(); };
  g("back").onclick=()=>{ lockResearcher(); history.replaceState(null,"",location.pathname+location.search); screenStart(); };
  g("dlAll").onclick=async()=>{ const r=await offerCsv(`dot-anchor_all_${stamp()}.csv`, toCsv(lsGet(LS.sessions,[]))); g("msg").textContent = r==="declined"?"내려받기를 취소했습니다.":r==="failed"?"내려받을 수 없습니다. 전체 CSV 복사를 사용해 주세요.":"파일을 내려받았습니다."; };
  g("cpAll").onclick=async()=>{ g("msg").textContent = (await copyText(toCsv(lsGet(LS.sessions,[]))))?"CSV를 클립보드에 복사했습니다.":"복사하지 못했습니다."; };
  const selBoxes=()=>Array.from(document.querySelectorAll(".selS"));
  const selUpdate=()=>{ const n=selBoxes().filter(b=>b.checked).length; g("delSel").disabled=!n; g("delSel").textContent = n?`선택한 세션 삭제 (${n}개)`:"선택한 세션 삭제"; };
  selBoxes().forEach(b=>b.onchange=()=>{ selUpdate(); if(g("selAll")) g("selAll").checked = selBoxes().every(x=>x.checked); });
  if(g("selAll")) g("selAll").onchange=e=>{ selBoxes().forEach(b=>b.checked=e.target.checked); selUpdate(); };
  // In-page confirmation: the artifact frame blocks window.confirm(), which made it return false silently.
  const askConfirm=(text, onYes)=>{
    g("confirmText").textContent=text; g("confirmBox").hidden=false; g("msg").textContent="";
    g("confirmNo").onclick=()=>{ g("confirmBox").hidden=true; };
    g("confirmYes").onclick=()=>{ g("confirmBox").hidden=true; onYes(); };
    g("confirmNo").focus();
  };
  g("delSel").onclick=()=>{
    const ids=new Set(selBoxes().filter(b=>b.checked).map(b=>b.value));
    if(!ids.size) return;
    askConfirm(`선택한 세션 ${ids.size}개를 지웁니다. 지운 데이터는 되돌릴 수 없으니, 필요하면 먼저 CSV를 내려받아 주세요.`, ()=>{
    const cur=lsGet(LS.sessions,[]); const c=lsGet(LS.counts,{}), lc=lsGet(LS.listCounts,{});
    for(const x of cur) if(ids.has(x.sessionId)){
      c[x.condition]=Math.max(0,(c[x.condition]||0)-1);
      for(const L of (x.lists||(x.list?[x.list]:[]))) lc[L]=Math.max(0,(lc[L]||0)-1);
    }
    lsSet(LS.sessions, cur.filter(x=>!ids.has(x.sessionId))); lsSet(LS.counts,c); lsSet(LS.listCounts,lc);
    screenResearcher(); g("msg").textContent=`세션 ${ids.size}개를 지웠습니다.`;
    });
  };
  g("wipe").onclick=()=>{
    askConfirm("이 기기에 저장된 모든 참여 데이터를 지웁니다. 지운 데이터는 되돌릴 수 없으니, 먼저 CSV를 내려받았는지 확인해 주세요.", ()=>{
      lsDel(LS.sessions); lsDel(LS.counts); lsDel(LS.listCounts); screenResearcher(); g("msg").textContent="저장된 데이터를 모두 지웠습니다.";
    });
  };
  const showTiming=t=>{ const n=Math.max(1,Math.round(f.briefMs/t.frameMs)); g("tm").textContent=`${t.hz.toFixed(1)} Hz, 한 프레임 ${t.frameMs.toFixed(2)}ms. subliminal 숫자는 ${n}프레임, 약 ${(n*t.frameMs).toFixed(1)}ms 동안 보입니다.` + (t.frameMs>20.5?" 이 화면은 주사율이 낮아 17ms 제시에 맞지 않습니다.":""); };
  g("meas").onclick=async()=>showTiming(await measureRefresh());
  const demo=async cond=>{
    if(!timing.frameMs) await measureRefresh();
    if(blockActive) return; blockActive = true;
    let p;
    try{ await enterStage(); p = await presentSequence(537, 500, cond, {seed:"preview"}); leaveStage(); }
    finally{ blockActive = false; }
    showTiming(timing);
    if(cond!=="none") g("tm").textContent += ` 방금 미리 보기에서 측정된 숫자 제시 시간은 ${p.anchorMeasuredMs}ms입니다.`;
  };
  g("demoB").onclick=()=>demo("brief"); g("demoR").onclick=()=>demo("readable");
}

/* ---------- researcher PIN ---------- */
// A 4-digit PIN only keeps participants from casually changing settings; it is not real security.
function pinHash(pin){ let h=0x811c9dc5; const t="dot-anchor:"+pin; for(let i=0;i<t.length;i++){ h^=t.charCodeAt(i); h=Math.imul(h,0x01000193)>>>0; } return h.toString(16).padStart(8,"0"); }
let researcherUnlocked = false, pinFails = 0, pinLockUntil = 0;
function lockResearcher(){ researcherUnlocked = false; }
function screenPin(){
  $app.className="center";
  $app.innerHTML = `
    <h1>연구자 확인</h1>
    <p>연구자 화면에 들어가려면 비밀번호 숫자 4자리를 입력해 주세요.</p>
    <div class="row">
      <input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="4" aria-label="비밀번호 4자리"
        style="font:inherit;font-size:24px;letter-spacing:.4em;width:150px;text-align:center;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)">
      <button class="primary" id="pinGo">확인</button>
    </div>
    <p class="small st-bad" id="pinMsg" style="min-height:1.7em;margin-top:10px"></p>
    <p style="margin-top:28px"><button class="linkish" id="pinBack">참여자 시작 화면으로</button></p>`;
  const inp=document.getElementById("pin"), msg=document.getElementById("pinMsg");
  inp.focus();
  const tryPin=()=>{
    const now=Date.now();
    if(now<pinLockUntil){ msg.textContent=`잠시 후 다시 시도해 주세요. (${Math.ceil((pinLockUntil-now)/1000)}초)`; return; }
    const v=inp.value.trim();
    if(!/^\d{4}$/.test(v)){ msg.textContent="숫자 4자리를 입력해 주세요."; return; }
    if(pinHash(v)===settings.pinHash){ pinFails=0; researcherUnlocked=true; screenResearcher(); return; }
    pinFails++; inp.value=""; inp.focus();
    if(pinFails>=5){ pinFails=0; pinLockUntil=Date.now()+30000; msg.textContent="5번 틀렸습니다. 30초 뒤에 다시 시도해 주세요."; }
    else msg.textContent=`비밀번호가 맞지 않습니다. (${pinFails}/5)`;
  };
  document.getElementById("pinGo").onclick=tryPin;
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter") tryPin(); });
  document.getElementById("pinBack").onclick=()=>{ history.replaceState(null,"",location.pathname+location.search); screenStart(); };
}

/* ---------- routing ---------- */
function route(){
  if(running) return;
  if(location.hash==="#researcher"){ if(researcherUnlocked) screenResearcher(); else screenPin(); }
  else { lockResearcher(); screenStart(); }
}
window.addEventListener("hashchange",route);
window.addEventListener("beforeunload",e=>{ if(running){ e.preventDefault(); e.returnValue=""; } });
route();
})();
</script>
